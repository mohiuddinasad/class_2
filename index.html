<html>
    <head><title>class no.2</title></head>
    <body>
        <form action="controlar.html" style="text-align: left;">
            <h2>Student Informarion Form</h2>
        <br>
        <label for="f_name">Fast name:</label>
            <input type="text" placeholder="-----fast name-----" name="f_name" id="f_name" required>
            <br><br>
            <label for="l_name">Last name:</label>
            <input type="text" placeholder="-----last name-----" name="l_name" id="l_name" required>
            <br><br>
            <label for="Email">Email :</label>
            <input type="text" placeholder="enter your email" name="Email" id="Email" required>
            <br><br>       
            <label for="password">Enter your password</label>
            <input type="password" name="password" id="password" required >
            <br><br>
            <label for="c_password">Confirm password</label>
            <input type="password" name="c_password" id="c_password"required>
            <br><br>
            <label for="number">phone Number:</label>
            <input type="number" name="number" id="number" required>
            <br><br>
            <label for="gender">Select Gender</label>
            <br>
            <input type="radio" name="gender" id="man"required>
            <label for="mna">man</label>
            <input type="radio" name="gender" id="women"required>
            <label for="women">women</label>
            <input type="radio" name="gender" id="other"required>
            <label for="other">other</label>
            <br><br>
            
            <select name="" id="" required>
                <option value="" disabled selected>select your division</option>
                <option value="">Chittagong</option>
                <option value="">Barishal</option>
                <option value="">Dhaka</option>
                <option value="">Khulna</option>
                <option value="">Rajshahi</option>
                <option value="">Rangpur</option>
                <option value="">Mymensingh</option>
                <option value="">Sylhet</option>
            </select>

            <br><br>
            <label for="img"><img width="70" src="picture-profile-icon-male-icon-human-or-people-sign-and-symbol-vector.jpg" alt=""></label><br>
            <input hidden type="file" name="" id="img" accept=".png" required>
            <br><br>
            <label for="date">select your birth date :</label>
            <input type="date" name="" id="date" required>
            <br><br>
            <label for="datetime"> select date and time</label>
            <input type="datetime-local" name="" id="datetime">
            <br><br>
            <label for="time">select just time</label>
            <input type="time" name="" id="time">
            <label for="search">Search</label>
            <input type="search" placeholder="search" name="" id="search">
            <br><br>
            <p>rest form</p>
            <label for="text"></label>
            <input type="text" placeholder="text" name="" id="text">
            <input type="password" placeholder="enter your password" name="" id="password">
            <button>rest</button>
            <br><br>
            <label for="color">choose color</label>
            <input type="color" name="" id="color">
            <label for="url">URL</label>
            <input type="url" name="" id="url">
            <br><br>
            <label for="details">Details</textarea></label><br>
            <textarea placeholder="details" rows="5" cols="50" name="" id="details" required></textarea>
            <br><br>
            <button type="submit">submit</button>
        </form>
        
           
    </body>
</html>
